<!doctype html>
<!-- <html lang="en" data-bs-theme="dark"> -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
    <title>Pingpal</title>
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="../node_modules/@fortawesome/fontawesome-free/js/brands.js"></script>
    <script defer src="../node_modules/@fortawesome/fontawesome-free/js/solid.js"></script>
    <script defer src="../node_modules/@fortawesome/fontawesome-free/js/fontawesome.js"></script>
</head>
<body>
  <div class="w-75 mx-auto p-2">
    <main>
      <div class="input-group">
        <input type="text" class="form-control" placeholder="IP or hostname" id="pingMe">
        <div class="input-group-append">
          <button class="btn btn-success" type="button" id="startButton"><i class="fas fa-play fa-xs"></i> Start</button>
          <button class="btn btn-danger" type="button" id="stopButton"><i class="fas fa-pause fa-xs"></i> Pause</button>
        </div>
      </div>
      <canvas class="my-2 w-100" id="pingChart" height="300"></canvas>
      <div class="row">
        <div class="w-25 mb-2">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between px-md-1">
                <div class="align-self-center">
                  <i class="fas fa-network-wired text-info fa-3x"></i>
                </div>
                <div class="text-end">
                  <h4 id="pingCount">0</h4>
                  <p class="mb-0">Pings</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="w-25 mb-2">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between px-md-1">
                <div class="align-self-center">
                  <i class="fas fa-triangle-exclamation text-danger fa-3x"></i>
                </div>
                <div class="text-end">
                  <h4 id="pingFailures">0</h4>
                  <p class="mb-0">Failures</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="w-25 mb-2">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between px-md-1">
                <div class="align-self-center">
                  <i class="fas fa-server text-secondary fa-3x"></i>
                </div>
                <div class="text-end">
                  <h4 id="lastResponse">0ms</h4>
                  <p class="mb-0">Last</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="w-25 mb-2">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between px-md-1">
                <div class="align-self-center">
                  <i class="fas fa-bolt text-warning fa-3x"></i>
                </div>
                <div class="text-end">
                  <h4 id="highestPing">0ms</h4>
                  <p class="mb-0">Highest</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="logToFileCheck" checked>
            <label class="form-check-label" for="logToFileCheck">
              Log to file
            </label>
          </div>
        </div>
        <div class="col-sm">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="soundOnFail" checked>
            <label class="form-check-label" for="soundOnFail">
              Play sound on failure
            </label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm">
          <div class="input-group mb-2">
            <input type="text" class="form-control" placeholder="Log saved to desktop" id="logFilepath" disabled>
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" id="openLogBtn">Open Log</button>
            </div>
          </div>
        </div>
      </div>
      <select class="form-select" multiple id="statusBox" style="height:125px; overflow:auto;"></select>
    </main>
    <footer class="pt-1 text-muted">
      <small>Pingpal <span id="versionNumber"></span></small><br>
      <a href="#" id="githubLink"><i class="fab fa-github text-muted"></i></a>
    </footer>
  </div>
  <script src="../node_modules/chart.js/dist/chart.umd.min.js"></script>
  <script src="./pingGraph.js"></script>
  <script src="./pingpalUI.js"></script>
</body>
</html>
